<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-label="Thomson Multiwood">
  <defs>
    <pattern id="grainLines" width="120" height="90" patternUnits="userSpaceOnUse">
      <path d="M12 12c30 12 44-8 74 4 20 8 28 28 48 24M0 62c42-18 70 20 120 0M20 88c24-18 50-4 78-16" fill="none" stroke="#ff9b3d" stroke-width="7" opacity=".55" stroke-linecap="round"/>
    </pattern>
    <filter id="wordShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#321309" flood-opacity=".75"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="18" fill="#ffffff"/>
  <g transform="translate(78 70)">
    <rect x="0" y="0" width="1244" height="590" rx="34" fill="#f58220"/>
    <rect x="0" y="0" width="1244" height="590" rx="34" fill="url(#grainLines)" opacity=".9"/>
    <rect x="30" y="30" width="1184" height="530" rx="22" fill="none" stroke="#ffffff" stroke-width="12"/>
    <text x="622" y="145" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="84" font-weight="900" letter-spacing="8" fill="#006b3f">THOMSON</text>
    <g filter="url(#wordShadow)">
      <text x="622" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="250" font-weight="900" letter-spacing="-12" fill="#ffffff" stroke="#2b1008" stroke-width="16" paint-order="stroke fill">multi</text>
      <text x="622" y="535" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="250" font-weight="900" letter-spacing="-12" fill="#ffffff" stroke="#2b1008" stroke-width="16" paint-order="stroke fill">wood</text>
    </g>
    <text x="622" y="610" text-anchor="middle" font-family="'Segoe Script', 'Brush Script MT', cursive" font-size="58" font-weight="700" fill="#006b3f" stroke="#ffffff" stroke-width="7" paint-order="stroke fill">Substitute For Wood</text>
    <text x="1170" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#ffffff">®</text>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner Admin | PK Holding</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body>
<header><a href="index.html"><img src="assets/pk-holding-logo-reference-font.png" alt="PK Holding"></a><span>Private owner administration</span></header>
<main>
  <section class="admin-card login-card" id="login-view"><p class="eyebrow">OWNER ACCESS</p><h1>Sign in to manage brand updates.</h1><p>Only the PK Holding owner account can upload posters, videos and brochures.</p><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Secure login</button><p class="status" role="status"></p></form></section>
  <section class="dashboard" id="dashboard" hidden>
    <div class="dashboard-head"><div><p class="eyebrow">CONTENT MANAGER</p><h1>Publish a brand update.</h1></div><button class="secondary" id="logout">Log out</button></div>
    <div class="admin-grid"><form class="admin-card" id="upload-form"><label>Brand name<input name="brand" placeholder="Example: Hettich" required maxlength="80"></label><label>Content type<select name="kind" id="upload-kind" required><option value="poster">Poster image</option><option value="video">Video</option><option value="brochure">Brochure PDF</option></select></label><label>Title<input name="title" placeholder="Update title" required maxlength="120"></label><label>Description<textarea name="description" rows="4" placeholder="Short description (optional)" maxlength="500"></textarea></label><label class="file-box">Choose file<input name="file" id="upload-file" type="file" accept="image/png,image/jpeg,image/webp" required><small id="file-help">PNG, JPG or WebP · maximum 25 MB</small></label><button id="upload-button">Upload and publish</button><progress id="upload-progress" value="0" max="100" hidden></progress><p class="status" id="upload-status" role="status"></p></form>
    <aside class="admin-card"><h2>Published updates</h2><p>New uploads appear automatically on the homepage.</p><div id="admin-items" class="admin-items"></div></aside></div>
  </section>
</main><script src="admin.js"></script></body></html>
